# Custom log format — at http level (OK in conf.d/ included from http block)
log_format analytics '$remote_addr|$http_x_forwarded_for|$time_local|$request_method|$request_uri|$status|$body_bytes_sent|$http_referer|$http_user_agent|$http_x_forwarded_for|$http_x_forwarded_proto';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log analytics;
    error_log /var/log/nginx/error.log;

    # Real IP from proxy chain
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dynamic robots.txt: prod crawlable, staging non-crawlable
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";

        set $robotstxt "User-agent: *\nAllow: /\n\nSitemap: https://reault.tech/sitemap.xml";

        if ($host ~* staging) {
            set $robotstxt "User-agent: *\nDisallow: /";
        }

        return 200 $robotstxt;
    }
    location = /sitemap.xml {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        try_files $uri /index.html;
    }
}